name: site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      # Same as HUGO_VERSION in the Workers Builds settings.
      HUGO_VERSION: "0.167.0"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Hugo
      run: |
        curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" hugo
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    - run: sh tests/run.sh
