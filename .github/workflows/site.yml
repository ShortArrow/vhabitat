name: site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      # Same as HUGO_VERSION in the Workers Builds settings.
      HUGO_VERSION: "0.167.0"
      # SHA-256 of hugo_${HUGO_VERSION}_linux-amd64.tar.gz, from the release's hugo_${HUGO_VERSION}_checksums.txt.
      HUGO_SHA256: "4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Hugo
      run: |
        tarball="$RUNNER_TEMP/hugo.tar.gz"
        curl -fsSL -o "$tarball" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
        echo "$HUGO_SHA256  $tarball" | sha256sum -c -
        tar -xzf "$tarball" -C "$RUNNER_TEMP" hugo
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    - run: sh tests/run.sh
    - run: sh tests/sightings.sh
