# config/_default/config.toml

baseURL = "https://vhabitat.shortarrow.jp/"
locale = "en"

DefaultContentLanguage = "en"
defaultContetLanguageInSubdir = true
hasCJKLanguage = true

enableRobotsTXT = true
enableEmoji = true
summaryLength = 30

buildDrafts = false
buildFuture = false

disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 20

[services.googleAnalytics]
  ID = "G-8HP6ECSQKQ"

[sitemap]
  changefreq = 'always'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
